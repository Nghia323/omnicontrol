name: Build & Publish OmniControl Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows MSI Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install WiX Toolset & cargo-wix
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH
          cargo install cargo-wix
      - name: Build Windows Release & MSI
        working-directory: desktop-agent
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo wix --nocapture -o OmniControlAgent-windows-x64.msi
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop-agent/OmniControlAgent-windows-x64.msi

  build-macos:
    name: macOS Universal DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build & Package macOS DMG
        working-directory: desktop-agent
        run: bash ../scripts/package-macos.sh
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop-agent/dist/OmniControlAgent-macos-universal.dmg

  build-android:
    name: Android Release APK & AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OMNI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-client/app/release-keystore.jks
      - name: Build Signed APK & AAB
        working-directory: android-client
        env:
          OMNI_KEYSTORE_PATH: release-keystore.jks
          OMNI_KEYSTORE_PASS: ${{ secrets.OMNI_KEYSTORE_PASS }}
          OMNI_KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          OMNI_KEY_PASS: ${{ secrets.OMNI_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            android-client/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android-client/app/build/outputs/apk/release/app-universal-release.apk
            android-client/app/build/outputs/bundle/release/app-release.aab

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release with Installers
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/OmniControlAgent-windows-x64.msi
            release-assets/OmniControlAgent-macos-universal.dmg
            release-assets/app-arm64-v8a-release.apk
            release-assets/app-universal-release.apk
            release-assets/app-release.aab
